plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Release signing comes from example/android/key.properties (gitignored) or RELEASE_* variables.
// Debug builds and tests never need it.
def releaseSigning = new Properties()
def releaseSigningFile = rootProject.file('key.properties')
if (releaseSigningFile.exists()) {
    releaseSigningFile.withInputStream { input ->
        releaseSigning.load(input)
    }
}

def releaseSigningValue = { String propertyName, String environmentName ->
    releaseSigning.getProperty(propertyName) ?: System.getenv(environmentName)
}
def releaseStoreFile = releaseSigningValue('storeFile', 'RELEASE_STORE_FILE')
def releaseStorePassword = releaseSigningValue('storePassword', 'RELEASE_STORE_PASSWORD')
def releaseKeyAlias = releaseSigningValue('keyAlias', 'RELEASE_KEY_ALIAS')
def releaseKeyPassword = releaseSigningValue('keyPassword', 'RELEASE_KEY_PASSWORD')
def hasReleaseSigning = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it }

android {
    namespace "com.codenameakshay.async_wallpaper_example"
    compileSdkVersion 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "com.codenameakshay.async_wallpaper_example"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

if (!hasReleaseSigning) {
    // Fail before any release work runs so the message is never hidden behind a later task error.
    gradle.taskGraph.whenReady { graph ->
        def needsReleaseSigning = graph.allTasks.any {
            it.name in ['assembleRelease', 'bundleRelease']
        }
        if (needsReleaseSigning) {
            throw new GradleException(
                'Release signing is required. Provide storeFile, storePassword, keyAlias, and keyPassword in example/android/key.properties, or set the RELEASE_* environment variables.'
            )
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.multidex:multidex:2.0.1'
}

flutter {
    source '../..'
}
